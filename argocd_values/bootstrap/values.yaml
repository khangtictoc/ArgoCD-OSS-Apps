global:
  cloudProvider: aws

  vaultConfig:
    namespace: admin
    refreshAfter: 30s

platformServices:
  arc-systems:
    enabled: true

  arc-runners:
    enabled: true
    vaultConfig:
      enabled: true
      secrets:
        - secret: gh-action-runner-connector-creds
          path: k8s/oss/ci/github-action-runner-connector
        - secret: gh-action-runner-dockerhub-connector-creds
          path: k8s/oss/ci/github-action-runner-dockerhub-connector

  cert-manager:
    enabled: true

  jenkins:
    enabled: true
    vaultConfig:
      enabled: true
      secrets:
        - secret: jenkins-admin-creds
          path: k8s/oss/ci/jenkins

  jenkins-inbound-agent:
    enabled: true
    vaultConfig:
      enabled: true
      secrets:
        - secret: jenkins-agent-dockerhub-connector-creds
          path: k8s/oss/ci/jenkins-inbound-agent-dockerhub-connector
        - secret: jenkins-agent-master-connector-creds
          path: k8s/oss/ci/jenkins-inbound-agent

  postgresql:
    enabled: true
    vaultConfig:
      enabled: true
      secrets:
        - secret: postgresql-admin-creds
          path: k8s/oss/database/postgresql

  mongodb-sharded:
    enabled: true
    vaultConfig:
      enabled: true
      secrets:
        - secret: mongodb-sharded-admin-creds
          path: k8s/oss/database/mongodb-sharded

  nginx-ingress:
    enabled: true

  grafana-dashboard:
    enabled: true
    vaultConfig:
      enabled: true
      secrets:
        - secret: grafana-dashboard-admin-creds
          path: k8s/oss/monitoring/grafana-dashboard

  grafana-loki:
    enabled: true

  grafana-mimir:
    enabled: true

  grafana-tempo:
    enabled: true

  grafana-alloy:
    enabled: true

  velero:
    enabled: true

  testing:
    enabled: true
