global:
  cloudProvider: aws

  vaultConfig:
    namespace: admin
    refreshAfter: 30s

platformServices:
  arc-systems:
    enabled: true

  arc-runners:
    enabled: true
    vaultConfig:
      enabled: true
      path: k8s/oss/ci/github-action-runner-connector

  cert-manager:
    enabled: true

  jenkins:
    enabled: true
    vaultConfig:
      enabled: true
      path: k8s/oss/ci/jenkins

  jenkins-inbound-agent:
    enabled: true
    vaultConfig:
      enabled: true
      path: k8s/oss/ci/jenkins-inbound-agent-dockerhub-connector

  postgresql:
    enabled: true
    vaultConfig:
      enabled: true
      path: k8s/oss/database/postgresql

  mongodb-sharded:
    enabled: true
    vaultConfig:
      enabled: true
      path: k8s/oss/database/mongodb-sharded

  nginx-ingress:
    enabled: true

  grafana-dashboard:
    enabled: true
    vaultConfig:
      enabled: true
      path: k8s/oss/monitoring/grafana-dashboard

  grafana-loki:
    enabled: true

  grafana-mimir:
    enabled: true

  grafana-tempo:
    enabled: true

  grafana-alloy:
    enabled: true

  velero:
    enabled: true

  testing:
    enabled: true
